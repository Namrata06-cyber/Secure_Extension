<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Phishing Detector</title>

    <style>

        body {

            width: 330px;

            margin: 0;

            padding: 15px;

            font-family: Arial, sans-serif;

            background: #f4f6f8;
        }


        h1 {

            text-align: center;

            font-size: 22px;

            margin-top: 5px;
        }


        .box {

            background: white;

            padding: 12px;

            margin-top: 12px;

            border-radius: 8px;

            box-shadow:
                0 2px 5px rgba(0,0,0,0.1);
        }


        .box h2 {

            font-size: 17px;

            margin-top: 0;
        }


        .score {

            font-size: 24px;

            font-weight: bold;
        }


        #level {

            font-weight: bold;
        }


        li {

            font-size: 12px;

            margin-bottom: 5px;
        }


        #url {

            font-size: 11px;

            word-break: break-all;
        }

    </style>

</head>


<body>


<h1>🛡️ Phishing Detector</h1>


<div class="box">

    <h2>Website</h2>

    <p id="url">
        Loading...
    </p>

</div>


<div class="box">

    <h2>Overall Risk</h2>

    <p
        id="risk"
        class="score">
        Loading...
    </p>

    <p id="level">
        Analyzing...
    </p>

</div>


<div class="box">

    <h2>URL Analysis</h2>

    <p id="urlScore">
        Loading...
    </p>

    <ul id="urlWarnings"></ul>

</div>


<div class="box">

    <h2>JavaScript Analysis</h2>

    <p id="jsScore">
        Loading...
    </p>

    <ul id="jsWarnings"></ul>

</div>


<script src="popup.js"></script>


</body>

</html>
