[project]
name = "url-analyzer"
version = "1.1.0"
description = "URL Analysis module of the Group SY503 phishing-detection browser extension"
requires-python = ">=3.10"
dependencies = []                      # the analyzer itself uses only the standard library

[project.optional-dependencies]
eval = ["pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "joblib>=1.3"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
